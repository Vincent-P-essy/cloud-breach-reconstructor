name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements-dev.lock
      - name: Install locked tooling and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Static quality gates
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy src/cloud_breach_reconstructor
          python -m compileall -q src tests scripts
      - name: Tests and branch coverage
        run: |
          coverage run -m unittest discover -s tests -t . -v
          coverage report
      - name: Reproducibility and evidence gates
        run: |
          sha256sum --check datasets/reference/inputs.sha256
          python scripts/quality_gate.py
          python -m cloud_breach_reconstructor benchmark datasets/lab/events.jsonl --truth datasets/lab/ground-truth.json --iterations 20 --fail-under 1.0

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate Compose deployment
        run: docker compose -f compose.yaml config --quiet
      - name: Build hardened image
        run: docker build --tag cloud-breach-reconstructor:ci .
      - name: Analyze the reference evidence read-only
        run: >-
          docker run --rm --read-only --cap-drop=ALL
          --security-opt=no-new-privileges
          cloud-breach-reconstructor:ci
          python -m cloud_breach_reconstructor benchmark datasets/lab/events.jsonl
          --truth datasets/lab/ground-truth.json --iterations 5 --fail-under 1.0

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.lock
          python -m build --no-isolation
      - name: Test installed wheel outside the repository
        run: |
          python -m venv /tmp/cloud-breach-wheel
          /tmp/cloud-breach-wheel/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          /tmp/cloud-breach-wheel/bin/python scripts/installed_smoke.py
      - name: Test source distribution contents
        run: |
          mkdir /tmp/cloud-breach-sdist
          tar -xzf dist/*.tar.gz -C /tmp/cloud-breach-sdist
          cd /tmp/cloud-breach-sdist/cloud_breach_reconstructor-*
          PYTHONPATH=src python -m unittest discover -s tests -t .
